name: Migrate clean I Am Omani v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone old source
        run: git clone --depth 1 https://github.com/turkik69/i-am-Omani.git /tmp/old

      - name: Copy project and materialize real images
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' --exclude='DEPLOY_TRIGGER.txt' --exclude='render.yaml' --exclude='asset-data' --exclude='public/_tmp-note.txt' --exclude='public/.asset-upload-note' --exclude='public/assets/v25' /tmp/old/ ./
          rm -rf public/assets
          mkdir -p public/assets
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          def webp(src,dst):
              b=Path(src).read_bytes(); out=b
              if not b.startswith(b'RIFF'):
                  text=b.decode('ascii'); compact=re.sub(r'\s+','',text)
                  out=base64.b64decode(compact + '='*((4-len(compact)%4)%4), validate=False)
              if not out.startswith(b'RIFF'):
                  raise SystemExit(f'Invalid WebP: {src}')
              Path(dst).write_bytes(out)
              print(dst,len(out))
          webp('/tmp/old/public/assets/sahwa-hero.webp','public/assets/sahwa.webp')
          webp('/tmp/old/public/assets/municipality-card.webp','public/assets/municipality.webp')
          webp('/tmp/old/public/assets/opera-card.webp','public/assets/opera.webp')
          webp('/tmp/old/public/assets/riyam-card.webp','public/assets/riyam.webp')
          PY
          cp /tmp/old/public/oman-music.js public/oman-music-source.js
          rm -f public/sahwa-photo.b64 public/municipality-photo.b64 public/opera-photo.b64 public/riyam-photo.b64
          rm -f public/omani-bg10.b64 public/omani-bg-15.b64 public/oman-heritage-bg.b64
          rm -f public/oman-v27.css public/oman-home-v2.css public/oman-audio-v2.js public/oman-music.js
          rm -f public/app-icon-180.png public/app-icon-192.png public/app-icon-512.png
          file public/assets/*.webp

      - name: Write clean identity
        shell: bash
        run: |
          cat > public/oman-identity.js <<'EOF'
          (()=>{
            const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];
            const A={sahwa:'/assets/sahwa.webp?v=clean2',municipality:'/assets/municipality.webp?v=clean2',opera:'/assets/opera.webp?v=clean2',riyam:'/assets/riyam.webp?v=clean2'};
            const make=(type,cls='')=>{const i=document.createElement('img');i.src=A[type];i.alt='';i.className=`oman-art ${type} ${cls}`.trim();i.decoding='async';i.draggable=false;return i};
            function add(sel,type,cls,style={}){const h=q(sel);if(!h||h.querySelector('.'+cls))return;const i=make(type,cls);Object.assign(i.style,style);h.prepend(i)}
            function setup(){
              qa('.floating-trophy').forEach(h=>{h.innerHTML='';h.appendChild(make('sahwa','hero-sahwa'))});
              add('#homeScreen','municipality','home-municipality',{left:'50%',bottom:'-3%',width:'112%',transform:'translateX(-50%)',opacity:'.42'});add('#homeScreen','riyam','home-riyam',{right:'-7%',top:'12%',width:'31%',opacity:'.56'});
              add('#hostCreateScreen','municipality','create-municipality',{left:'50%',bottom:'-5%',width:'118%',transform:'translateX(-50%)',opacity:'.82'});add('#hostCreateScreen','sahwa','create-sahwa',{left:'50%',top:'0',width:'31%',transform:'translateX(-50%)'});
              add('#joinScreen','opera','join-opera',{left:'-12%',bottom:'-4%',width:'86%',opacity:'.95'});add('#joinScreen','sahwa','join-sahwa',{left:'36%',top:'0',width:'31%'});add('#joinScreen','riyam','join-riyam',{right:'-5%',top:'4%',width:'26%',opacity:'.84'});
              add('#displayJoinScreen','riyam','displayjoin-riyam',{left:'-8%',bottom:'0',width:'54%',opacity:'.9'});add('#displayJoinScreen','sahwa','displayjoin-sahwa',{right:'3%',top:'3%',width:'31%',opacity:'.92'});
              add('#hostLobbyScreen','municipality','lobby-municipality',{left:'50%',bottom:'-14%',width:'96%',transform:'translateX(-50%)',opacity:'.4'});add('#playerLobbyScreen','opera','player-opera',{left:'-8%',bottom:'-13%',width:'92%',opacity:'.48'});
              add('#questionScreen','riyam','question-riyam',{left:'-10%',bottom:'1%',width:'46%',opacity:'.92'});add('#questionScreen','opera','question-opera',{left:'29%',bottom:'-12%',width:'62%',opacity:'.74'});add('#questionScreen','sahwa','question-sahwa',{right:'-1%',top:'2%',width:'21%',opacity:'.9'});
              add('#resultScreen','municipality','result-municipality',{left:'-8%',bottom:'-11%',width:'60%',opacity:'.7'});add('#resultScreen','opera','result-opera',{right:'-9%',bottom:'-12%',width:'60%',opacity:'.66'});add('#resultScreen','sahwa','result-sahwa',{left:'50%',top:'0',width:'23%',transform:'translateX(-50%)'});
              add('#finalScreen','municipality','final-municipality',{left:'-6%',bottom:'-8%',width:'62%',opacity:'.76'});add('#finalScreen','opera','final-opera',{right:'-8%',bottom:'-9%',width:'60%',opacity:'.72'});add('#finalScreen','sahwa','final-sahwa',{left:'50%',top:'0',width:'26%',transform:'translateX(-50%)'});add('#finalScreen','riyam','final-riyam',{right:'-3%',top:'8%',width:'22%',opacity:'.72'});
              add('#displayScreen','riyam','display-riyam',{left:'-10%',bottom:'1%',width:'44%',opacity:'.9'});add('#displayScreen','opera','display-opera',{left:'31%',bottom:'-11%',width:'60%',opacity:'.7'});add('#displayScreen','sahwa','display-sahwa',{right:'0',top:'1%',width:'20%',opacity:'.9'});
              [['.host-card','municipality'],['.player-card','opera'],['.display-card','riyam']].forEach(([s,t])=>{const h=q(s);if(h&&!h.querySelector('.oman-card-art'))h.prepend(make(t,'oman-card-art'))});
              document.documentElement.dataset.omanAssets='ready';
            }
            document.title='أنا عُماني';document.body.classList.add('iam-clean');if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup,{once:true});else setup();
          })();
          EOF

      - name: Write clean theme
        shell: bash
        run: |
          cat > public/oman-theme.css <<'EOF'
          :root{--gold:#f6c35b;--cyan:#34ddff;--pink:#ff55c8;--violet:#6d45ff;--navy:#050b24}html,body{background:radial-gradient(circle at 50% 5%,#29126a 0,#09113b 34%,#040819 100%)!important;color:#fff;overflow-x:hidden}body{font-family:Cairo,system-ui,sans-serif}.ambient{display:none!important}.topbar{position:sticky;top:0;z-index:1000;background:rgba(3,7,29,.94)!important;border-bottom:1px solid rgba(246,195,91,.38)!important;box-shadow:0 10px 30px rgba(0,0,0,.32)!important;backdrop-filter:blur(14px)}.logo3d{background:linear-gradient(145deg,#8c63ff,#5e31df)!important;box-shadow:0 0 22px rgba(117,73,255,.55)!important}.brand b{letter-spacing:.2em!important}.screen{position:relative;isolation:isolate;min-height:calc(100vh - 76px);overflow:hidden;background:linear-gradient(180deg,rgba(5,9,31,.12),rgba(5,9,31,.78) 68%,#050819)!important}.screen:before{content:"";position:absolute;inset:0;z-index:-5;background:radial-gradient(circle at 16% 24%,rgba(51,220,255,.16),transparent 28%),radial-gradient(circle at 88% 20%,rgba(255,77,201,.15),transparent 27%),radial-gradient(circle at 50% 100%,rgba(116,67,255,.22),transparent 43%)}.oman-art{position:absolute!important;display:block!important;z-index:-2;pointer-events:none!important;object-fit:contain;filter:drop-shadow(0 18px 28px rgba(0,0,0,.55)) drop-shadow(0 0 20px rgba(255,188,73,.25));animation:omanFloat 6s ease-in-out infinite}@keyframes omanFloat{50%{translate:0 -5px}}#homeScreen{padding-bottom:54px!important}.hero{position:relative;z-index:2;min-height:600px!important;padding:16px!important;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center}.floating-trophy{position:absolute!important;top:14px!important;left:50%!important;transform:translateX(-50%)!important;width:min(360px,88vw)!important;height:300px!important;background:none!important;overflow:visible!important}.floating-trophy .hero-sahwa{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important}.eyebrow{z-index:3;background:rgba(17,20,65,.78)!important;border:1px solid rgba(246,195,91,.56)!important;color:#ffe7b0!important;padding:9px 18px!important;border-radius:999px!important;box-shadow:0 0 26px rgba(246,195,91,.13)!important}.hero h1{z-index:3;font-size:clamp(54px,14vw,92px)!important;margin:14px 0 8px!important;line-height:1!important}.hero h1 span,.final-title{background:linear-gradient(90deg,#41e7ff,#7e58ff 45%,#ff58c9 74%,#ffd48b);-webkit-background-clip:text;background-clip:text;color:transparent!important}.hero p{z-index:3;color:#fff!important;font-size:17px!important;line-height:1.9!important;text-shadow:0 2px 16px #000}.mode-grid{position:relative;z-index:3;max-width:1120px!important;display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:22px!important;margin:30px auto 0!important;padding:0 22px 70px!important}.mode-card{position:relative!important;min-height:230px!important;padding:116px 24px 26px!important;overflow:hidden!important;border-radius:30px!important;border:1px solid rgba(116,81,255,.72)!important;background:linear-gradient(145deg,rgba(23,26,91,.93),rgba(31,16,77,.9))!important;box-shadow:0 22px 45px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.08)!important}.oman-card-art{position:absolute!important;z-index:1!important;top:-58px!important;right:8px!important;width:74%!important;height:172px!important}.mode-card strong,.mode-card small,.mode-card .arrow{position:relative;z-index:2}.mode-card strong{font-size:25px!important}.mode-card small{color:#dce4ff!important}.mode-card .mode-icon{display:none!important}.panel,.question-card,.result-hero,.final-wrap,.display-stage{position:relative;z-index:3;background:linear-gradient(145deg,rgba(26,28,94,.9),rgba(21,15,67,.91))!important;border:1px solid rgba(123,82,255,.72)!important;box-shadow:0 22px 55px rgba(0,0,0,.4),0 0 28px rgba(99,60,255,.15)!important;backdrop-filter:blur(14px)}.primary-btn{background:linear-gradient(90deg,#552eff,#ff38c5 55%,#1cbcff)!important;box-shadow:0 0 26px rgba(113,53,255,.26)!important}.secondary-btn,.mini-btn{background:rgba(12,18,67,.74)!important;border-color:rgba(246,195,91,.32)!important}.question-card h2{background:linear-gradient(90deg,#fff,#38ddff,#ff52c9);-webkit-background-clip:text;background-clip:text;color:transparent}.answer-btn{background:linear-gradient(145deg,rgba(18,27,92,.96),rgba(45,17,98,.94))!important;border:1px solid rgba(126,82,255,.65)!important}.answer-btn:nth-child(1){box-shadow:inset 4px 0 #24d9ff!important}.answer-btn:nth-child(2){box-shadow:inset 4px 0 #8d57ff!important}.answer-btn:nth-child(3){box-shadow:inset 4px 0 #ff54c8!important}.answer-btn:nth-child(4){box-shadow:inset 4px 0 #ffc95d!important}#musicBtn.music-on{box-shadow:0 0 20px rgba(246,195,91,.5)!important;border-color:rgba(246,195,91,.65)!important}@media(max-width:760px){.hero{min-height:520px!important}.floating-trophy{width:min(310px,86vw)!important;height:245px!important}.hero h1{font-size:60px!important}.mode-grid{grid-template-columns:1fr!important;gap:20px!important;margin-top:16px!important;padding:0 18px 60px!important}.mode-card{min-height:174px!important;padding:82px 22px 22px!important}.oman-card-art{top:-40px!important;width:62%!important;height:126px!important}.mode-card strong{font-size:27px!important}.home-municipality{width:145%!important;bottom:-5%!important;opacity:.28!important}.home-riyam{width:44%!important;right:-15%!important;top:16%!important}.create-municipality,.join-opera{width:145%!important;left:50%!important;transform:translateX(-50%)!important;opacity:.42!important}.create-sahwa,.join-sahwa{width:48%!important;left:50%!important;transform:translateX(-50%)!important}}
          EOF

      - name: Write reliable music controller
        shell: bash
        run: |
          cat > public/oman-audio.js <<'EOF'
          (()=>{const KEY='iamOmaniMusic';let enabled=localStorage.getItem(KEY)!=='off',audio=null;const q=s=>document.querySelector(s);function btn(){const b=q('#musicBtn');if(!b)return;b.textContent=enabled?'♫':'🔇';b.classList.toggle('music-on',enabled);b.title=enabled?'إيقاف الموسيقى العُمانية':'تشغيل الموسيقى العُمانية'}function get(){if(audio)return audio;if(!window.OMAN_MUSIC_SRC)throw new Error('music source missing');audio=new Audio(window.OMAN_MUSIC_SRC);audio.loop=true;audio.preload='auto';audio.volume=.07;return audio}async function play(){if(!enabled)return;try{await get().play()}catch(e){console.warn('Omani music waits for user gesture',e?.message||e)}}document.addEventListener('pointerdown',play,{once:true,passive:true});document.addEventListener('touchend',play,{once:true,passive:true});document.addEventListener('click',e=>{if(!e.target.closest?.('#musicBtn'))return;e.preventDefault();enabled=!enabled;localStorage.setItem(KEY,enabled?'on':'off');btn();if(enabled)play();else audio?.pause()},true);document.addEventListener('visibilitychange',()=>{if(document.hidden)audio?.pause();else play()});btn()})();
          EOF

      - name: Normalize index and PWA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html');s=p.read_text()
          for pat in [r'<link rel="stylesheet" href="/oman-premium\.css[^>]*>.*?\n?',r'<link rel="stylesheet" href="/oman-home-v2\.css[^>]*>.*?\n?',r'<link rel="stylesheet" href="/oman-v27\.css[^>]*>.*?\n?']:
              s=re.sub(pat,'',s)
          if '/oman-theme.css' not in s:s=s.replace('</head>','  <link rel="stylesheet" href="/oman-theme.css?v=clean2" />\n</head>')
          s=re.sub(r'<script src="/oman-identity\.js[^>]*></script>','<script src="/oman-identity.js?v=clean2"></script>',s)
          s=re.sub(r'<script src="/oman-audio-v2\.js[^>]*></script>','<script src="/oman-music-source.js?v=clean2"></script><script src="/oman-audio.js?v=clean2"></script>',s)
          s=re.sub(r'<script src="/oman-music\.js[^>]*></script>','',s)
          s=re.sub(r'/app\.js\?v=\d+','/app.js?v=clean2',s);s=re.sub(r'/manifest\.json\?v=\d+','/manifest.json?v=clean2',s);s=re.sub(r'/icon\.svg\?v=\d+','/icon.svg?v=clean2',s)
          p.write_text(s)
          PY
          cat > public/manifest.json <<'EOF'
          {"name":"أنا عُماني","short_name":"أنا عُماني","description":"مسابقات عُمانية حية","id":"/","start_url":"/","scope":"/","display":"standalone","orientation":"portrait-primary","background_color":"#050819","theme_color":"#090b2d","lang":"ar","dir":"rtl","icons":[{"src":"/icon.svg?v=clean2","sizes":"any","type":"image/svg+xml","purpose":"any"}]}
          EOF
          cat > public/sw.js <<'EOF'
          const CACHE='iam-omani-clean-2';self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));self.addEventListener('fetch',e=>{const u=new URL(e.request.url);if(e.request.method!=='GET'||u.pathname.startsWith('/socket.io')||u.pathname.startsWith('/api/'))return;e.respondWith(fetch(e.request,{cache:'no-store'}).catch(()=>caches.match(e.request)))})
          EOF

      - name: Validate clean project
        run: |
          node --check server.js
          node --check baloot-server.js
          node --check baloot-bootstrap.js
          node --check public/app.js
          node --check public/oman-identity.js
          node --check public/oman-audio.js
          node --check public/oman-music-source.js
          test -s public/assets/sahwa.webp
          test -s public/assets/municipality.webp
          test -s public/assets/opera.webp
          test -s public/assets/riyam.webp

      - name: Commit migrated project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'clean: migrate complete I Am Omani app with real images and embedded music'
          git push origin main
