name: Build clean I Am Omani repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone previous project as source
        run: git clone --depth 1 https://github.com/turkik69/i-am-Omani.git /tmp/old

      - name: Copy application logic only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public/assets public/audio

          cp /tmp/old/package.json ./package.json
          cp /tmp/old/server.js ./server.js
          cp /tmp/old/baloot-bootstrap.js ./baloot-bootstrap.js
          cp /tmp/old/baloot-server.js ./baloot-server.js
          cp /tmp/old/firestore.rules ./firestore.rules
          cp /tmp/old/.gitignore ./.gitignore

          for f in \
            app.js styles.css approval-flow.css approval-flow.js \
            auth-system.css auth-system.js firebase-auth-ui.css firebase-auth-ui.js \
            game-catalog.css game-catalog.js oman-villages.js oman-wilayat-themes.js \
            progression-ui.css progression-ui.js village-directory-ui.js \
            baloot-icon.svg muscat-municipality.svg royal-opera.svg riyam.svg sahwa-tower.svg; do
            [ -f "/tmp/old/public/$f" ] && cp "/tmp/old/public/$f" "public/$f"
          done

          cp /tmp/old/public/index.html public/index.html

          # Convert the former text/base64 landmark files into real binary WebP assets.
          tr -d '\r\n\t ' < /tmp/old/public/assets/sahwa-hero.webp | base64 -d > public/assets/sahwa.webp
          tr -d '\r\n\t ' < /tmp/old/public/assets/municipality-card.webp | base64 -d > public/assets/municipality.webp
          tr -d '\r\n\t ' < /tmp/old/public/assets/opera-card.webp | base64 -d > public/assets/opera.webp
          tr -d '\r\n\t ' < /tmp/old/public/assets/riyam-card.webp | base64 -d > public/assets/riyam.webp

          # Convert Omani background music into a real MP3 file.
          tr -d '\r\n\t ' < /tmp/old/public/omani-bg10.b64 | base64 -d > public/audio/omani-bg.mp3

          file public/assets/*.webp public/audio/omani-bg.mp3

      - name: Write clean visual identity runtime
        shell: bash
        run: |
          cat > public/oman-identity.js <<'EOF'
          (()=>{
            const V='clean-1';
            const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
            const A={
              sahwa:'/assets/sahwa.webp?v='+V,
              municipality:'/assets/municipality.webp?v='+V,
              opera:'/assets/opera.webp?v='+V,
              riyam:'/assets/riyam.webp?v='+V
            };
            function img(type,cls=''){const i=document.createElement('img');i.src=A[type];i.alt='';i.className=`oman-art ${type} ${cls}`.trim();i.decoding='async';i.draggable=false;return i}
            function add(sel,type,cls,style={}){const h=q(sel);if(!h||h.querySelector('.'+cls))return;const i=img(type,cls);Object.assign(i.style,style);h.prepend(i)}
            function setup(){
              qa('.floating-trophy').forEach(h=>{h.innerHTML='';h.appendChild(img('sahwa','hero-sahwa'))});
              add('#homeScreen','municipality','home-municipality',{left:'50%',bottom:'-3%',width:'112%',transform:'translateX(-50%)',opacity:'.42'});
              add('#homeScreen','riyam','home-riyam',{right:'-7%',top:'12%',width:'31%',opacity:'.56'});
              add('#hostCreateScreen','municipality','create-municipality',{left:'50%',bottom:'-5%',width:'118%',transform:'translateX(-50%)',opacity:'.82'});
              add('#hostCreateScreen','sahwa','create-sahwa',{left:'50%',top:'0',width:'31%',transform:'translateX(-50%)'});
              add('#joinScreen','opera','join-opera',{left:'-12%',bottom:'-4%',width:'86%',opacity:'.95'});
              add('#joinScreen','sahwa','join-sahwa',{left:'36%',top:'0',width:'31%'});
              add('#joinScreen','riyam','join-riyam',{right:'-5%',top:'4%',width:'26%',opacity:'.84'});
              add('#questionScreen','riyam','question-riyam',{left:'-10%',bottom:'1%',width:'46%',opacity:'.92'});
              add('#questionScreen','opera','question-opera',{left:'29%',bottom:'-12%',width:'62%',opacity:'.74'});
              add('#questionScreen','sahwa','question-sahwa',{right:'-1%',top:'2%',width:'21%',opacity:'.9'});
              add('#finalScreen','municipality','final-municipality',{left:'-6%',bottom:'-8%',width:'62%',opacity:'.76'});
              add('#finalScreen','opera','final-opera',{right:'-8%',bottom:'-9%',width:'60%',opacity:'.72'});
              add('#finalScreen','sahwa','final-sahwa',{left:'50%',top:'0',width:'26%',transform:'translateX(-50%)'});
              add('#displayScreen','riyam','display-riyam',{left:'-10%',bottom:'1%',width:'44%',opacity:'.9'});
              add('#displayScreen','opera','display-opera',{left:'31%',bottom:'-11%',width:'60%',opacity:'.7'});
              add('#displayScreen','sahwa','display-sahwa',{right:'0',top:'1%',width:'20%',opacity:'.9'});
              [['.host-card','municipality'],['.player-card','opera'],['.display-card','riyam']].forEach(([s,t])=>{const h=q(s);if(h&&!h.querySelector('.oman-card-art'))h.prepend(img(t,'oman-card-art'))});
              document.documentElement.dataset.omanAssets='ready';
            }
            document.title='أنا عُماني';
            document.body.classList.add('iam-clean');
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup,{once:true});else setup();
          })();
          EOF

      - name: Write one clean theme stylesheet
        shell: bash
        run: |
          cat > public/oman-theme.css <<'EOF'
          :root{--gold:#f6c35b;--cyan:#34ddff;--pink:#ff55c8;--violet:#6d45ff;--navy:#050b24}
          html,body{background:radial-gradient(circle at 50% 5%,#29126a 0,#09113b 34%,#040819 100%)!important;color:#fff;overflow-x:hidden}
          body{font-family:Cairo,system-ui,sans-serif}.ambient{display:none!important}
          .topbar{position:sticky;top:0;z-index:1000;background:rgba(3,7,29,.94)!important;border-bottom:1px solid rgba(246,195,91,.38)!important;box-shadow:0 10px 30px rgba(0,0,0,.32)!important;backdrop-filter:blur(14px)}
          .logo3d{background:linear-gradient(145deg,#8c63ff,#5e31df)!important;box-shadow:0 0 22px rgba(117,73,255,.55)!important}.brand b{letter-spacing:.2em!important}
          .screen{position:relative;isolation:isolate;min-height:calc(100vh - 76px);overflow:hidden;background:linear-gradient(180deg,rgba(5,9,31,.12),rgba(5,9,31,.78) 68%,#050819)!important}
          .screen:before{content:"";position:absolute;inset:0;z-index:-5;background:radial-gradient(circle at 16% 24%,rgba(51,220,255,.16),transparent 28%),radial-gradient(circle at 88% 20%,rgba(255,77,201,.15),transparent 27%),radial-gradient(circle at 50% 100%,rgba(116,67,255,.22),transparent 43%)}
          .oman-art{position:absolute!important;display:block!important;z-index:-2;pointer-events:none!important;object-fit:contain;filter:drop-shadow(0 18px 28px rgba(0,0,0,.55)) drop-shadow(0 0 20px rgba(255,188,73,.25));animation:omanFloat 6s ease-in-out infinite}@keyframes omanFloat{50%{translate:0 -5px}}
          #homeScreen{padding-bottom:54px!important}.hero{position:relative;z-index:2;min-height:600px!important;padding:16px!important;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center}.floating-trophy{position:absolute!important;top:14px!important;left:50%!important;transform:translateX(-50%)!important;width:min(360px,88vw)!important;height:300px!important;background:none!important;overflow:visible!important}.floating-trophy .hero-sahwa{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important}
          .eyebrow{z-index:3;background:rgba(17,20,65,.78)!important;border:1px solid rgba(246,195,91,.56)!important;color:#ffe7b0!important;padding:9px 18px!important;border-radius:999px!important}.hero h1{z-index:3;font-size:clamp(54px,14vw,92px)!important;margin:14px 0 8px!important;line-height:1!important}.hero h1 span,.final-title{background:linear-gradient(90deg,#41e7ff,#7e58ff 45%,#ff58c9 74%,#ffd48b);-webkit-background-clip:text;background-clip:text;color:transparent!important}.hero p{z-index:3;color:#fff!important;font-size:17px!important;line-height:1.9!important;text-shadow:0 2px 16px #000}
          .mode-grid{position:relative;z-index:3;max-width:1120px!important;display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:22px!important;margin:30px auto 0!important;padding:0 22px 70px!important}.mode-card{position:relative!important;min-height:230px!important;padding:116px 24px 26px!important;overflow:hidden!important;border-radius:30px!important;border:1px solid rgba(116,81,255,.72)!important;background:linear-gradient(145deg,rgba(23,26,91,.93),rgba(31,16,77,.9))!important;box-shadow:0 22px 45px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.08)!important}.oman-card-art{position:absolute!important;z-index:1!important;top:-58px!important;right:8px!important;width:74%!important;height:172px!important}.mode-card strong,.mode-card small,.mode-card .arrow{position:relative;z-index:2}.mode-card strong{font-size:25px!important}.mode-card small{color:#dce4ff!important}.mode-card .mode-icon{display:none!important}
          .panel,.question-card,.result-hero,.final-wrap,.display-stage{position:relative;z-index:3;background:linear-gradient(145deg,rgba(26,28,94,.9),rgba(21,15,67,.91))!important;border:1px solid rgba(123,82,255,.72)!important;box-shadow:0 22px 55px rgba(0,0,0,.4),0 0 28px rgba(99,60,255,.15)!important;backdrop-filter:blur(14px)}.primary-btn{background:linear-gradient(90deg,#552eff,#ff38c5 55%,#1cbcff)!important}.answer-btn{background:linear-gradient(145deg,rgba(18,27,92,.96),rgba(45,17,98,.94))!important;border:1px solid rgba(126,82,255,.65)!important}.question-card h2{background:linear-gradient(90deg,#fff,#38ddff,#ff52c9);-webkit-background-clip:text;background-clip:text;color:transparent}
          #musicBtn.music-on{box-shadow:0 0 20px rgba(246,195,91,.5)!important;border-color:rgba(246,195,91,.65)!important}
          @media(max-width:760px){.hero{min-height:520px!important}.floating-trophy{width:min(310px,86vw)!important;height:245px!important}.hero h1{font-size:60px!important}.mode-grid{grid-template-columns:1fr!important;gap:20px!important;margin-top:16px!important;padding:0 18px 60px!important}.mode-card{min-height:174px!important;padding:82px 22px 22px!important}.oman-card-art{top:-40px!important;width:62%!important;height:126px!important}.mode-card strong{font-size:27px!important}.home-municipality{width:145%!important;bottom:-5%!important;opacity:.28!important}.home-riyam{width:44%!important;right:-15%!important;top:16%!important}.create-municipality,.join-opera{width:145%!important;left:50%!important;transform:translateX(-50%)!important;opacity:.42!important}.create-sahwa,.join-sahwa{width:48%!important;left:50%!important;transform:translateX(-50%)!important}}
          EOF

      - name: Write reliable music controller
        shell: bash
        run: |
          cat > public/oman-audio.js <<'EOF'
          (()=>{
            const KEY='iamOmaniMusic';
            let enabled=localStorage.getItem(KEY)!=='off',audio=null;
            const q=s=>document.querySelector(s);
            function button(){const b=q('#musicBtn');if(!b)return;b.textContent=enabled?'♫':'🔇';b.classList.toggle('music-on',enabled);b.title=enabled?'إيقاف الموسيقى العُمانية':'تشغيل الموسيقى العُمانية'}
            function get(){if(audio)return audio;audio=new Audio('/audio/omani-bg.mp3?v=clean-1');audio.loop=true;audio.preload='auto';audio.volume=.075;return audio}
            async function play(){if(!enabled)return;try{await get().play()}catch(e){console.warn('music waits for user gesture',e?.message||e)}}
            document.addEventListener('pointerdown',play,{once:true,passive:true});
            document.addEventListener('touchend',play,{once:true,passive:true});
            document.addEventListener('click',e=>{if(!e.target.closest?.('#musicBtn'))return;e.preventDefault();enabled=!enabled;localStorage.setItem(KEY,enabled?'on':'off');button();enabled?play():audio?.pause()},true);
            document.addEventListener('visibilitychange',()=>{if(document.hidden)audio?.pause();else play()});
            button();
          })();
          EOF

      - name: Normalize index and PWA files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          import re
          s=re.sub(r'<link rel="stylesheet" href="/oman-premium\.css[^>]*>','',s)
          s=re.sub(r'<link rel="stylesheet" href="/oman-home-v2\.css[^>]*>','',s)
          s=s.replace('</head>','  <link rel="stylesheet" href="/oman-theme.css?v=clean-1" />\n</head>')
          s=re.sub(r'<script src="/oman-identity\.js[^>]*></script>','<script src="/oman-identity.js?v=clean-1"></script>',s)
          s=re.sub(r'<script src="/oman-audio-v2\.js[^>]*></script>','<script src="/oman-audio.js?v=clean-1"></script>',s)
          s=re.sub(r'/app\.js\?v=\d+','/app.js?v=clean-1',s)
          s=re.sub(r'/manifest\.json\?v=\d+','/manifest.json?v=clean-1',s)
          s=re.sub(r'/icon\.svg\?v=\d+','/icon.svg?v=clean-1',s)
          p.write_text(s)
          PY

          cat > public/manifest.json <<'EOF'
          {"name":"أنا عُماني","short_name":"أنا عُماني","description":"مسابقات عُمانية حية","id":"/","start_url":"/","scope":"/","display":"standalone","orientation":"portrait-primary","background_color":"#050819","theme_color":"#090b2d","lang":"ar","dir":"rtl","icons":[{"src":"/icon.svg?v=clean-1","sizes":"any","type":"image/svg+xml","purpose":"any"}]}
          EOF

          cat > public/sw.js <<'EOF'
          const CACHE='iam-omani-clean-1';
          self.addEventListener('install',e=>{self.skipWaiting()});
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{const u=new URL(e.request.url);if(e.request.method!=='GET'||u.pathname.startsWith('/socket.io')||u.pathname.startsWith('/api/'))return;e.respondWith(fetch(e.request,{cache:'no-store'}).catch(()=>caches.match(e.request)))});
          EOF

      - name: Validate runtime assets
        shell: bash
        run: |
          node --check server.js
          node --check baloot-server.js
          node --check baloot-bootstrap.js
          node --check public/app.js
          node --check public/oman-identity.js
          node --check public/oman-audio.js
          test -s public/assets/sahwa.webp
          test -s public/assets/municipality.webp
          test -s public/assets/opera.webp
          test -s public/assets/riyam.webp
          test -s public/audio/omani-bg.mp3

      - name: Commit clean application
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'clean: migrate complete I Am Omani app with real assets and music' || exit 0
          git push origin main
